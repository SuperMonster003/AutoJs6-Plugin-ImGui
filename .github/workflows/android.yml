name: Android CI

on:
  pull_request:
  push:
    branches:
      - "master"
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: imgui-android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out sources
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify TypeScript and upstream contracts
        run: |
          set -euo pipefail
          npm install --global typescript@5.1.3
          python tools/update_imgui_upstream.py --check
          tsc --project app/src/test/types/tsconfig.json

      - name: Verify debug ABI APKs and instrumentation compilation
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :app:verifyImGuiDebugApks \
            :app:assembleDebugAndroidTest \
            --no-daemon \
            --build-cache \
            --console=plain \
            --stacktrace

      - name: Upload failure reports
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: imgui-verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: write
    env:
      ANDROID_SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
      ANDROID_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
      ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
      ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Check out tagged sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify tag and source contracts
        run: |
          set -euo pipefail
          version="$(sed -n 's/^VERSION_NAME=//p' version.properties)"
          test -n "$version"
          test "$GITHUB_REF_NAME" = "v$version"
          npm install --global typescript@5.1.3
          python tools/update_imgui_upstream.py --check
          tsc --project app/src/test/types/tsconfig.json

      - name: Materialize release signing configuration
        run: |
          set -euo pipefail
          test -n "$ANDROID_SIGNING_KEY_BASE64"
          test -n "$ANDROID_SIGNING_STORE_PASSWORD"
          test -n "$ANDROID_SIGNING_KEY_ALIAS"
          test -n "$ANDROID_SIGNING_KEY_PASSWORD"
          keystore="$RUNNER_TEMP/autojs6-plugin-imgui-release.jks"
          printf '%s' "$ANDROID_SIGNING_KEY_BASE64" | base64 --decode > "$keystore"
          {
            printf 'storeFile=%s\n' "$keystore"
            printf 'storePassword=%s\n' "$ANDROID_SIGNING_STORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_SIGNING_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_SIGNING_KEY_PASSWORD"
          } > sign.properties

      - name: Build and verify release APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            :app:verifyImGuiDebugApks \
            :app:assembleDebugAndroidTest \
            :app:appendDigestToReleasedFiles \
            --no-daemon \
            --build-cache \
            --console=plain \
            --stacktrace
          release_dir="releases/$GITHUB_REF_NAME"
          mapfile -t apks < <(find "$release_dir" -maxdepth 1 -type f -name '*.apk' -print | sort)
          test "${#apks[@]}" -eq 5
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -x "$apksigner"
          for apk in "${apks[@]}"; do
            "$apksigner" verify --verbose "$apk"
          done
          (cd "$release_dir" && sha256sum -- *.apk > SHA256SUMS)
          python .python/release_notes.py \
            --version "${GITHUB_REF_NAME#v}" \
            --source "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/release-notes.md"

      - name: Upload workflow release artifact
        uses: actions/upload-artifact@v7
        with:
          name: autojs6-plugin-imgui-${{ github.ref_name }}
          path: |
            releases/${{ github.ref_name }}/*.apk
            releases/${{ github.ref_name }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_dir="releases/$GITHUB_REF_NAME"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" "$release_dir"/*.apk "$release_dir/SHA256SUMS" --clobber

      - name: Remove signing material
        if: always()
        run: |
          rm -f sign.properties "$RUNNER_TEMP/autojs6-plugin-imgui-release.jks"
