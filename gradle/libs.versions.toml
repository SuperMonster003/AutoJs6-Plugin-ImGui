[versions]
commons-compress = "1.28.0"
junit = "4.13.2"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"
kotlin-runtime = "2.2.21"
xz = "1.10"

[libraries]
apache-commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
junit = { module = "junit:junit", version.ref = "junit" }
test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
kotlin-parcelize-runtime = { module = "org.jetbrains.kotlin:kotlin-parcelize-runtime", version.ref = "kotlin-runtime" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin-runtime" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "xz" }
